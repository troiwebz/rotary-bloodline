<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-r">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
    <linearGradient id="bg-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="suit-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1f3d"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bg-r)"/>

  <!-- Suit body -->
  <ellipse cx="100" cy="195" rx="72" ry="40" fill="url(#suit-r)" clip-path="url(#circle-r)"/>
  <rect x="28" y="148" width="144" height="60" fill="url(#suit-r)" clip-path="url(#circle-r)"/>

  <!-- Shirt / collar -->
  <polygon points="86,148 100,165 114,148 108,138 92,138" fill="#F8FAFC"/>

  <!-- Tie (gold/president colour) -->
  <polygon points="97,140 103,140 106,165 100,170 94,165" fill="#D97706"/>
  <polygon points="97,140 103,140 101,147 99,147" fill="#B45309"/>

  <!-- Lapels -->
  <polygon points="28,148 86,148 80,128 60,128 28,148" fill="#0f1f3d"/>
  <polygon points="172,148 114,148 120,128 140,128 172,148" fill="#0f1f3d"/>

  <!-- Rotary pin -->
  <circle cx="72" cy="136" r="5" fill="#FFD700" opacity="0.95"/>
  <circle cx="72" cy="136" r="3" fill="#1E40AF"/>

  <!-- Neck -->
  <rect x="88" y="112" width="24" height="28" rx="6" fill="#B8761E"/>

  <!-- Head -->
  <ellipse cx="100" cy="93" rx="34" ry="38" fill="#B8761E"/>

  <!-- Hair (full, slightly wavy) -->
  <ellipse cx="100" cy="58" rx="34" ry="15" fill="#0d0600"/>
  <ellipse cx="100" cy="55" rx="30" ry="11" fill="#0d0600"/>
  <!-- Side hair fuller -->
  <ellipse cx="67" cy="73" rx="9" ry="17" fill="#0d0600"/>
  <ellipse cx="133" cy="73" rx="9" ry="17" fill="#0d0600"/>

  <!-- Ears -->
  <ellipse cx="67" cy="93" rx="6" ry="9" fill="#B8761E"/>
  <ellipse cx="133" cy="93" rx="6" ry="9" fill="#B8761E"/>
  <ellipse cx="67" cy="93" rx="3" ry="5" fill="#9E6316"/>
  <ellipse cx="133" cy="93" rx="3" ry="5" fill="#9E6316"/>

  <!-- Eyebrows (slightly thicker, confident) -->
  <path d="M81 75 Q90 71 99 74" stroke="#0d0600" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M101 74 Q110 71 119 75" stroke="#0d0600" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="90" cy="85" rx="7" ry="5.5" fill="#fff"/>
  <ellipse cx="110" cy="85" rx="7" ry="5.5" fill="#fff"/>
  <circle cx="91" cy="86" r="3.5" fill="#1a0900"/>
  <circle cx="111" cy="86" r="3.5" fill="#1a0900"/>
  <circle cx="92" cy="84" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="112" cy="84" r="1.2" fill="#fff" opacity="0.7"/>
  <!-- Eyelids -->
  <path d="M83 82 Q90 79 97 82" stroke="#0d0600" stroke-width="1" fill="none"/>
  <path d="M103 82 Q110 79 117 82" stroke="#0d0600" stroke-width="1" fill="none"/>

  <!-- Nose -->
  <path d="M98 90 Q97 102 92 106 Q100 110 108 106 Q103 102 102 90" fill="#9E6316" opacity="0.65"/>

  <!-- Warm confident smile -->
  <path d="M85 113 Q100 124 115 113" stroke="#7a3030" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M87 115 Q100 122 113 115" fill="#C07070" opacity="0.45"/>

  <!-- Faint moustache -->
  <path d="M90 108 Q100 112 110 108" stroke="#2d0d00" stroke-width="2" fill="none" opacity="0.45"/>

  <!-- President star badge (subtle) on background -->
  <text x="155" y="32" font-size="22" text-anchor="middle" fill="#FFD700" opacity="0.85">⭐</text>
</svg>
